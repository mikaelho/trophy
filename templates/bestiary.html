{% include "frame_top.html" %}
<style>
    .die-face-light { fill: #ffffff; stroke: #6b7280; stroke-width: 1.2; }
    .die-pip-light { fill: #18181b; }
    .die { display: inline-flex; }
    .habit-die svg { width: 1.5rem; height: 1.5rem; }
    .field-label { font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase;
                   color: var(--color-base-content); opacity: 0.55; font-weight: 600; }
    .monster-box { border: 1px solid var(--color-base-300); border-radius: 0.5rem;
                   background: var(--color-base-100); padding: 0.85rem; }
    /* Defences grows to fit its content instead of a fixed height */
    .monster-box textarea { field-sizing: content; resize: none; overflow: hidden; }
    /* a field being edited by another user (hard lock): dimmed + warning ring */
    .locked-field { outline: 2px solid var(--color-warning); outline-offset: -1px;
                    opacity: 0.6; cursor: not-allowed; border-radius: 0.25rem; }
</style>

<div class="container mx-auto p-4 max-w-5xl">
    <div class="flex justify-between items-center mb-2">
        <h1 class="text-3xl font-bold">Bestiary</h1>
        <button class="btn btn-primary btn-sm" phx-click="bestiary_add">+ Add</button>
    </div>

    <div class="flex flex-col gap-4">
        {% for m in monsters %}
        <div class="monster-box">
            <div class="flex gap-3 items-end mb-3">
                <div class="text-center shrink-0">
                    <div class="field-label">Endurance</div>
                    <input type="number" min="0" value="{{m.endurance}}"
                           class="input input-sm input-bordered w-16 text-center {% if m.endurance_locked %}locked-field{% endif %}" name="value"
                           phx-blur="bestiary_save" phx-value-id="{{m.id}}" phx-value-field="endurance"
                           phx-focus="bestiary_lock" phx-value-key="endurance"
                           {% if m.endurance_locked %}disabled title="Someone is editing this"{% endif %} />
                </div>
                <div class="flex-1 min-w-0">
                    <div class="field-label">Name</div>
                    <input class="input input-sm input-bordered w-full {% if m.name_locked %}locked-field{% endif %}" value="{{m.name}}" name="value"
                           phx-blur="bestiary_save" phx-value-id="{{m.id}}" phx-value-field="name"
                           phx-focus="bestiary_lock" phx-value-key="name" autocomplete="off"
                           {% if m.name_locked %}disabled title="Someone is editing this"{% endif %} />
                </div>
                <div class="flex-[2] min-w-0">
                    <div class="field-label">Description</div>
                    <input class="input input-sm input-bordered w-full {% if m.description_locked %}locked-field{% endif %}" value="{{m.description}}" name="value"
                           phx-blur="bestiary_save" phx-value-id="{{m.id}}" phx-value-field="description"
                           phx-focus="bestiary_lock" phx-value-key="description" autocomplete="off"
                           {% if m.description_locked %}disabled title="Someone is editing this"{% endif %} />
                </div>
                <button class="btn btn-ghost btn-xs px-1 text-error" id="del-monster-{{m.id}}"
                        phx-click="bestiary_remove" phx-value-id="{{m.id}}"
                        phx-hook="ConfirmClick" data-confirm="Remove?" title="Remove">&times;</button>
            </div>

            <div class="field-label mb-1">Habits</div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-4 gap-y-1 mb-3">
                {% for h in m.habits %}
                <div class="flex items-center gap-2">
                    <span class="die habit-die shrink-0">{{h.svg}}</span>
                    <input class="input input-xs input-bordered w-full {% if h.locked %}locked-field{% endif %}" value="{{h.text}}" name="value"
                           phx-blur="bestiary_save_habit" phx-value-id="{{m.id}}" phx-value-n="{{h.n}}"
                           phx-focus="bestiary_lock" phx-value-key="habit:{{h.n}}" autocomplete="off"
                           {% if h.locked %}disabled title="Someone is editing this"{% endif %} />
                </div>
                {% endfor %}
            </div>

            <div class="flex gap-3">
                <div class="flex-1 min-w-0">
                    <div class="field-label">Defences</div>
                    <textarea class="textarea textarea-bordered w-full {% if m.defences_locked %}locked-field{% endif %}" rows="1" name="value"
                              phx-blur="bestiary_save" phx-value-id="{{m.id}}" phx-value-field="defences"
                              phx-focus="bestiary_lock" phx-value-key="defences"
                              {% if m.defences_locked %}disabled title="Someone is editing this"{% endif %}>{{m.defences}}</textarea>
                </div>
                <div class="w-1/3 shrink-0">
                    <div class="field-label">Weakness</div>
                    <input class="input input-sm input-bordered w-full {% if m.weakness_locked %}locked-field{% endif %}" value="{{m.weakness}}" name="value"
                           phx-blur="bestiary_save" phx-value-id="{{m.id}}" phx-value-field="weakness"
                           phx-focus="bestiary_lock" phx-value-key="weakness" autocomplete="off"
                           {% if m.weakness_locked %}disabled title="Someone is editing this"{% endif %} />
                </div>
            </div>
        </div>
        {% endfor %}

        {% if not monsters %}
        <div class="text-base-content/50 italic">Nothing here yet.</div>
        {% endif %}
    </div>
</div>
{% include "frame_bottom.html" %}
